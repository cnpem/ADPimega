services:
  ioc:
    image: ${IMAGE_NAME}:${TAG}
    build:
      context: ./
      target: dynamic-link
      dockerfile: docker/Dockerfile
      network: host
      labels:
        org.opencontainers.image.source: ${REPOSITORY_URL}
      args:
        REPONAME: epics/modules/areaDetector/ADPimega
        BUILD_PACKAGES: libczmq-dev libjson-c-dev
        BUILD_TAR_PACKAGES: http://download.lnls.br/packages/libpimega_2.8.0.0-1_amd64.tar.gz 7a41b7b847a89666453d4c44b4df11a705237251b986f4f7aa99dfd0f2aab57a
        RUNTIME_PACKAGES: libxml2 libtiff6 libglib2.0-0 libjson-c5 libczmq4 libgomp1
        RUNTIME_TAR_PACKAGES: http://download.lnls.br/packages/libpimega_2.8.0.0-1_amd64.tar.gz 7a41b7b847a89666453d4c44b4df11a705237251b986f4f7aa99dfd0f2aab57a
        RUNDIR: /opt/epics/modules/areaDetector/ADPimega/iocs/pimegaIOC/iocBoot/iocPimega
